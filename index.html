<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Croatia Quiz</title>
<style>
  :root { --bg:#101418; --card:#1a2027; --ink:#e8ecef; --dim:#8b98a5; --acc:#ffd166; --up:#6fd08c; --down:#ef6f6c; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  #app { max-width:640px; margin:0 auto; padding:14px; }
  .screen { max-width:1100px; margin:0 auto; padding:28px; }
  h1 { font-size:1.6rem; margin:.3em 0; } .screen h1 { font-size:2.2rem; }
  h2 { font-size:1.15rem; margin:.8em 0 .3em; }
  .qtext { line-height:1.3; }
  .dim { color:var(--dim); } .big-p { font-size:1.2rem; }
  .card { background:var(--card); border-radius:14px; padding:18px; margin:10px 0; }
  .center { text-align:center; }
  .avatar { font-size:4rem; margin:.2em 0; }
  .bar { display:flex; justify-content:space-between; align-items:center; padding:6px 4px; font-weight:600; }
  .row { display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
  .spread { justify-content:space-between; }
  .clock { color:var(--acc); font-variant-numeric:tabular-nums; }
  .big-clock { font-size:2.4rem; font-weight:700; }
  button { font:inherit; color:var(--ink); background:#26303a; border:1px solid #38434f; border-radius:12px; padding:12px 14px; cursor:pointer; }
  button:disabled { opacity:.4; }
  button.big { width:100%; font-size:1.15rem; padding:16px; background:var(--acc); color:#1a1a1a; border:none; font-weight:700; }
  button.danger { border-color:var(--down); color:var(--down); background:transparent; }
  .btnrow { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0; }
  .opt { display:block; width:100%; text-align:left; margin:8px 0; }
  .opt.sel { background:var(--acc); color:#1a1a1a; font-weight:700; border-color:var(--acc); }
  .opt-s { background:var(--card); border-radius:10px; padding:12px 14px; }
  .optgrid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:16px 0; }
  .stakebox { margin-top:16px; border-top:1px solid #2c3640; padding-top:12px; }
  input[type=range] { width:100%; accent-color:var(--acc); height:34px; }
  .delta { font-size:2rem; font-weight:800; margin:.2em 0; }
  .up { color:var(--up); } .down { color:var(--down); }
  .qr { display:inline-block; background:#fff; padding:14px; border-radius:10px; margin:12px 0; }
  .grid { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:14px 0; }
  .chip { background:var(--card); border-radius:999px; padding:6px 12px; }
  .poolbar { height:22px; background:var(--down); border-radius:999px; overflow:hidden; margin:14px 0 6px; }
  .poolW { height:100%; background:var(--up); }
  .mult { font-size:1.8rem; color:var(--acc); }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:26px; margin-top:14px; }
  @media (max-width:700px){ .cols{grid-template-columns:1fr;} .optgrid{grid-template-columns:1fr;} }
  ol.board, ul.board { list-style-position:inside; padding:0; margin:.3em 0; }
  .board li { display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px solid #232c35; }
  .log { background:#0c1013; border-radius:10px; padding:10px; font-size:.8rem; white-space:pre-wrap; min-height:60px; }
</style>
</head>
<body>
<div id="app"><div class="card center"><h1>Croatia Quiz</h1><p class="dim">Loading&#8230;</p></div></div>
<script type="module">
  import { initFb } from "./js/fb.js";
  const root = document.getElementById("app");
  const view = (location.hash.replace("#", "").split("?")[0]) || "join";
  const files = { join: "player", screen: "screen", host: "host", swarm: "swarm" };
  window.addEventListener("hashchange", () => location.reload());
  if (!initFb()) {
    root.innerHTML = `<div class="card"><h1>Almost there</h1><p>Paste your Firebase config into <code>js/config.js</code> (see the README, step 2) and push. This page will then come alive.</p></div>`;
  } else {
    import(`./js/views/${files[view] || "player"}.js`)
      .then((m) => m.mount(root))
      .catch((e) => { root.innerHTML = `<div class="card"><h1>Error</h1><p class="dim">${e.message}</p></div>`; });
  }
</script>
</body>
</html>
