<script type="module">
  import { initFb } from "./js/fb.js";
  import { BUILD, SHOW_REFRESH } from "./js/config.js";
  let __lastTouch = 0;
  document.addEventListener("touchend", (e) => {
    const now = Date.now();
    if (now - __lastTouch < 350) e.preventDefault();
    __lastTouch = now;
  }, { passive: false });
  document.addEventListener("dblclick", (e) => e.preventDefault(), { passive: false });
  const root = document.getElementById("app");
  const view = (location.hash.replace("#", "").split("?")[0]) || "join";
  const files = { join: "player", screen: "screen", host: "host", swarm: "swarm", data: "data" };
  window.addEventListener("hashchange", () => location.reload());
  if (!(await initFb())) {
    root.innerHTML = `<div class="card"><h1>Almost there</h1><p>Paste your Firebase config into <code>js/config.js</code> (see the README, step 2) and push. This page will then come alive.</p></div>`;
  } else {
    const FILES = ["index.html","version.json","js/config.js","js/questions.js","js/characters.js","js/engine.js","js/fb.js","js/bots.js","js/finale.js","js/views/player.js","js/views/screen.js","js/views/host.js","js/views/swarm.js"];
    const bust = async () => { try { await Promise.all(FILES.map((f) => fetch(f, { cache: "reload" }))); } catch (e) {} };
    const chk = document.createElement("button");
    chk.className = "refresh-btn"; chk.textContent = "running " + BUILD + " \u00b7 live \u2026";
    document.body.appendChild(chk);
    let liveBuild = null;
    const doUpdate = async () => {
      chk.textContent = "updating\u2026";
      await bust(); location.reload();
    };
    chk.onclick = doUpdate;
    async function checkVersion() {
      try {
        const r = await fetch("version.json?t=" + Date.now(), { cache: "no-store" });
        liveBuild = (await r.json()).build || null;
      } catch (e) { return; }
      if (!liveBuild) return;
      if (liveBuild === BUILD) {
        chk.classList.remove("stale"); chk.classList.add("ok");
        chk.textContent = BUILD + " \u2713 current";
        return;
      }
      chk.classList.add("stale"); chk.classList.remove("ok");
      chk.textContent = "running " + BUILD + " \u00b7 live " + liveBuild + ". Tap to update";
      if (view === "screen" || view === "host" || view === "swarm") {
        const key = "cq_upd_" + liveBuild;
        const last = +(sessionStorage.getItem(key) || 0);
        if (Date.now() - last > 90000) { sessionStorage.setItem(key, String(Date.now())); await doUpdate(); }
        else chk.textContent = "running " + BUILD + " \u00b7 live " + liveBuild + ". Waiting for cache to clear";
      }
    }
    setInterval(checkVersion, 30000); checkVersion();
    import(`./js/views/${files[view] || "player"}.js`)
      .then((m) => m.mount(root))
      .catch((e) => { root.innerHTML = `<div class="card"><h1>Error</h1><p class="dim">${e.message}</p></div>`; });
  }
</script>
